      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="g" x1="200" y1="100" x2="1000" y2="650">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
