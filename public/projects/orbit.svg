  <rect x="620" y="300" width="400" height="110" rx="16" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.15"/>
  <rect x="620" y="430" width="400" height="110" rx="16" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.15"/>
